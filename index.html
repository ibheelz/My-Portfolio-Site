  <body>
    <div id="root"></div>
    <script>
      // Wait for the React app to load
      window.addEventListener('load', function() {
        setTimeout(function() {
          // Find all elements with text "Hire Me" or "View Resume"
          const buttons = document.querySelectorAll('button, a');
          buttons.forEach(function(btn) {
            const text = btn.textContent.trim().toLowerCase();

            // Handle "Hire Me" buttons
            if (text.includes('hire me') || text === 'hire me') {
              // Create mailto link
              const subject = encodeURIComponent('Project Inquiry');
              const body = encodeURIComponent('Hi,\n\nI came across your portfolio and would love to discuss working together.\n\nPlease let me know your availability.\n\nThank you!');
              const mailtoLink = 'mailto:abioladeyeye@gmail.com?subject=' + subject + '&body=' + body;

              // Update the button
              btn.style.cursor = 'pointer';
              btn.onclick = function(e) {
                e.preventDefault();
                window.location.href = mailtoLink;
              };

              // If it's an <a> tag, also update the href
              if (btn.tagName === 'A') {
                btn.href = mailtoLink;
              }
            }

            // Handle "View Resume" buttons
            if (text.includes('view resume') || text.includes('resume')) {
              btn.style.cursor = 'pointer';
              btn.onclick = function(e) {
                e.preventDefault();
                // Create a temporary link to download the PDF
                const link = document.createElement('a');
                link.href = '/Resume.pdf';
                link.download = 'Resume.pdf';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
              };

              // If it's an <a> tag, also update the href
              if (btn.tagName === 'A') {
                btn.href = '/Resume.pdf';
                btn.download = 'Resume.pdf';
              }
            }
          });
        }, 1000); // Wait 1 second for React to render
      });
    </script>
  </body>
</html>
